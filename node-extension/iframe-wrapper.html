<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nice One</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="inner-iframe" allow="microphone *; autoplay *" allowtransparency="true"></iframe>
  <script src="iframe-wrapper.js"></script>
</body>
</html>
