<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nice One</title>
    <style>
      body {
        width: 300px;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        margin: 0;
      }
      h2 {
        margin-top: 0;
        font-size: 18px;
        color: #333;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 4px;
      }
      .status-label {
        font-weight: 500;
      }
      .toggle {
        position: relative;
        width: 44px;
        height: 24px;
        background: #ccc;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .toggle.active {
        background: #002cf2;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: left 0.3s;
      }
      .toggle.active::after {
        left: 22px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #002cf2;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        background: #0020c0;
      }
      .info {
        font-size: 12px;
        color: #666;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Nice One</h2>

    <div class="status">
      <span class="status-label">Extension Status</span>
      <div class="toggle" id="toggle"></div>
    </div>

    <button id="optionsBtn">Open Settings</button>

    <div class="info">
      Works on <strong>niceonesa.com</strong> only. Use the toggle to enable or disable the voice agent.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
