<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="EraCoda">
  <rect width="64" height="64" rx="14" fill="#14223d"/>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="#1c2e4d"/>

  <!-- Bold E letterform matching EraCoda wordmark style -->
  <g fill="none">
    <!-- Vertical stem -->
    <rect x="16" y="14" width="8" height="36" rx="2" fill="#ffffff"/>
    <!-- Top bar -->
    <rect x="16" y="14" width="28" height="8" rx="2" fill="#ffffff"/>
    <!-- Middle bar (gold accent) -->
    <rect x="16" y="28" width="22" height="8" rx="2" fill="#f0a528"/>
    <!-- Bottom bar -->
    <rect x="16" y="42" width="28" height="8" rx="2" fill="#ffffff"/>
  </g>
</svg>
